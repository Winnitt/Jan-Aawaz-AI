<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Tricolor Ring Gradient -->
    <linearGradient id="saffronOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#FF6600" />
    </linearGradient>

    <linearGradient id="indiaGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#128807" />
      <stop offset="100%" stop-color="#095503" />
    </linearGradient>

    <!-- Drop Shadow for Megaphone -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Circular Outer Navy Badge -->
  <circle cx="32" cy="32" r="30" fill="#0A192F" stroke="#1E293B" stroke-width="2" />

  <!-- India Tricolor Accent Ring Arc -->
  <path d="A 26 26 0 0 1 58 32" fill="none" stroke="url(#saffronOrange)" stroke-width="4" stroke-linecap="round" />
  <path d="M 6 32 A 26 26 0 0 0 32 58" fill="none" stroke="url(#indiaGreen)" stroke-width="4" stroke-linecap="round" />

  <!-- Location Pin Element (representing civic mapping) -->
  <path d="M 46 16 C 42.7 16 40 18.7 40 22 C 40 26.5 46 32 46 32 C 46 32 52 26.5 52 22 C 52 18.7 49.3 16 46 16 Z" fill="#FF9933" />
  <circle cx="46" cy="21" r="2" fill="#FFFFFF" />

  <!-- Megaphone Icon (Voice / Aawaz) -->
  <g filter="url(#shadow)">
    <!-- Main Cone -->
    <path d="M 22 26 L 35 20 L 35 42 L 22 36 Z" fill="#FFFFFF" />
    <!-- Speaker Flare -->
    <ellipse cx="35" cy="31" rx="2.5" ry="11" fill="#FF9933" />
    <!-- Back Base -->
    <rect x="16" y="26" width="6" height="10" rx="1.5" fill="#E2E8F0" />
    <!-- Handle -->
    <path d="M 20 36 L 23 44 C 23.5 45.2 22.5 46 21.2 46 L 18.5 46 C 17.2 46 16.5 45 16.8 43.8 L 18.5 36 Z" fill="#CBD5E1" />
    <!-- Sound Waves (Public Voice) -->
    <path d="M 40 25 A 7 7 0 0 1 40 37" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 44 21 A 12 12 0 0 1 44 41" fill="none" stroke="#FF9933" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>